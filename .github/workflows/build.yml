name: Build and push add-on image

on:
  push:
    branches: [main]
    paths:
      - worldmonitor/Dockerfile
      - worldmonitor/rootfs/**
      - .github/workflows/build.yml
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/worldmonitor-addon

jobs:
  build:
    runs-on: ubuntu-latest
    # Normal builds (arm64 via QEMU emulation) take 18-24min. Without an
    # explicit cap this falls back to GitHub's default 360min timeout, so a
    # genuinely wedged run (seen twice in a row on 2026-07-26, same step,
    # no reported GitHub incident at the time) silently burns hours of CI
    # time instead of failing loud and letting a retry take over quickly.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(grep '^version:' worldmonitor/config.yaml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./worldmonitor
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
